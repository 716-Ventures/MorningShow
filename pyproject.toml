[project]
name = "personal-morning-radio"
version = "0.1.0"
description = "Local-first personal morning radio proof of concept."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "httpcore>=1.0.9,<2",
  "pydantic>=2.8.0",
  "python-dateutil>=2.9.0",
  "pyyaml>=6.0.2",
  "rich>=13.7.1",
  "trafilatura>=1.12.2",
  "typer>=0.12.3",
]

[project.optional-dependencies]
tts = [
  "kokoro>=0.9.4",
  "numpy>=1.26",
  "pip>=26.0",
  "soundfile>=0.12.1",
]

[project.scripts]
morning-radio = "morning_radio.cli:app"

[dependency-groups]
dev = [
  "pyright>=1.1.411",
  "pytest-cov>=5.0.0",
  "pytest>=8.3.0",
  "respx>=0.21.1",
  "ruff>=0.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morning_radio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "e2e: offline end-to-end fixture tests",
  "live: opt-in tests that require live local services or network access",
]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PERF", "RUF", "S"]
ignore = [
  "E501",
  "PERF401",
  "S101",
  "S603",
  "S608",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",
  "S108",
  "S603",
  "S607",
]

[tool.coverage.run]
branch = true
source = ["morning_radio"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true

[tool.pyright]
include = ["src", "tests"]
exclude = [
  "**/__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
pythonPlatform = "Darwin"
typeCheckingMode = "basic"
strict = ["src/morning_radio/newsroom/fetch.py", "src/morning_radio/newsroom/download.py", "src/morning_radio/newsroom/transport.py", "src/morning_radio/llm/client.py", "src/morning_radio/settings.py"]
reportMissingTypeStubs = false
