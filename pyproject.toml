[project]
name = "personal-morning-radio"
version = "0.1.0"
description = "Local-first personal morning radio proof of concept."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "python-dateutil>=2.9.0",
  "pyyaml>=6.0.2",
  "rich>=13.7.1",
  "trafilatura>=1.12.2",
  "typer>=0.12.3",
]

[project.optional-dependencies]
tts = [
  "kokoro>=0.9.4",
  "numpy>=1.26",
  "soundfile>=0.12.1",
]

[project.scripts]
morning-radio = "morning_radio.cli:app"

[dependency-groups]
dev = [
  "pyright>=1.1.411",
  "pytest>=8.3.0",
  "respx>=0.21.1",
  "ruff>=0.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morning_radio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["src", "tests"]
exclude = [
  "**/__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
pythonPlatform = "Darwin"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
